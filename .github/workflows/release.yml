# ═══════════════════════════════════════════════════════════════════════════
# release.yml — Distro release pipeline.
#
# Fires on every `v*` tag push (and on demand via workflow_dispatch):
#   1. build-verify — builds both Docker images locally (no push) to prove
#      they compile on a clean runner, but doesn't publish to GHCR.
#   2. release-artifacts — bundles the compose stack + source and attaches
#      them to the GitHub Release (only runs on tag push, not workflow_dispatch).
#
# Distro is a self-hosted platform: operators build from source via
# `docker compose build`.  GHCR publishing is not part of the release.
# ═══════════════════════════════════════════════════════════════════════════

name: Distro release pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to build (default: use the pushed tag)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: distro-release
  cancel-in-progress: false

jobs:
  build-verify:
    name: Build verification (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: apps/control-plane
          push: false
          load: true
          tags: distro/control-plane:verify

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          target: bolt-ai-production
          push: false
          build-args: |
            VITE_DISTRO_GATEWAY_ONLY=true
            VITE_DISTRO_CONTROL_PLANE=true
            VITE_LOG_LEVEL=debug
            BUILD_HEAP_MB=4096

  release-artifacts:
    name: Attach release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the compose stack
        run: |
          tar czf distro-stack.tar.gz \
            docker-compose.yml .env.example README.md docs apps/control-plane/bin \
            apps/control-plane/schema.sql apps/control-plane/src apps/web/Dockerfile
          ls -lh distro-stack.tar.gz

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" distro-stack.tar.gz --clobber
