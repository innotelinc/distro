# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — static checks on push and pull requests.
#
# The repo is maintained at zero findings: any shellcheck warning/error/note
# on a tracked script, a compose file that fails to interpolate, or a
# control-plane file that does not parse fails the build.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck tracked shell scripts
        run: |
          set -euo pipefail
          # Only the scripts we author: .githooks guard infra and repo-root
          # scripts/. Everything under apps/web is vendored upstream bolt.diy
          # shell code and is excluded, like any third-party tree.
          mapfile -t scripts < <(git ls-files '.githooks/*' 'scripts/*.sh')
          echo "Checking ${#scripts[@]} scripts"
          docker run --rm -v "$PWD":/mnt:ro -w /mnt \
            koalaman/shellcheck:v0.10.0 -s bash "${scripts[@]}"

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the root stack compose file
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

  control-plane:
    name: Control plane syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: node --check over control-plane sources
        run: |
          set -euo pipefail
          # Only iterate files git actually tracks (avoids empty-glob failures).
          mapfile -t files < <(git ls-files 'apps/control-plane/*.js' 'apps/control-plane/*.mjs' 'apps/control-plane/bin/*.mjs')
          for f in "${files[@]}"; do
            node --check "$f"
          done
          echo "All ${#files[@]} control-plane sources parse"
