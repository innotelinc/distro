# Onyx exports its bulk storage over NFS (userspace).
#
# This box is an LXC container, so the kernel NFS server cannot export anything
# ("exportfs: does not support NFS export" — it needs CAP_SYS_ADMIN on the
# host). NFS-Ganesha does the same job from userspace, which is why this file,
# not /etc/exports, is the export table that matters.
#
# TWO sibling exports, one per share distro's pools are built on:
#
#   /mnt/onyx/main-pool            the USB SanDisk pool created from the
#                                  Storage page (pools `main-pool` and `sdc`)
#   /mnt/onyx/onyx-data            the directory on the 40 GiB system dataset
#                                  that the `onyx-data` pool writes into
#
# They are siblings, not nested. A nested pair (pseudo /mnt/onyx plus pseudo
# /mnt/onyx/main-pool) cannot be built here: ganesha's VFS FSAL fails the
# pseudo-fs node for a child whose parent is itself a mount point on this
# kernel, and nfsd exits with "LOOKUP main-pool failed with Undefined server
# error". Siblings have no such parent lookup.
#
# NFSv3 is the protocol clients actually use here. NFSv4 mounts and even writes
# succeed against this build (ganesha 4.3), but READDIR comes back EIO — `ls`
# on a freshly mounted v4 share fails with "Remote I/O error" while creating a
# file in the same directory works, so it reads as a permissions problem and is
# not one. v3 has no such failure. Both are enabled so a v3 client just works;
# mount with `-o vers=3`.
NFS_CORE_PARAM {
  Protocols = 3,4;
  NFS_Port = 2049;
  Enable_NLM = false;
  Enable_RQUOTA = false;
}

# The USB pool. Two of distro's pools (main-pool, sdc) are this one filesystem:
# Onyx records the user's share and the device reconciler's own row, and both
# point here. Exporting it once and mounting it twice on the client is the same
# bytes with one server-side export.
EXPORT {
  Export_Id = 78;
  Path = /mnt/onyx/main-pool;
  Pseudo = /mnt/onyx/main-pool;
  Protocols = 3,4;
  Access_Type = RW;
  SecType = sys;
  # Distro's control plane has no account on this box: every client is mapped
  # to the pool's owner (1000) instead.
  Squash = All_Squash;
  Anonymous_Uid = 1000;
  Anonymous_Gid = 1000;
  FSAL {
    Name = VFS;
  }
  CLIENT {
    Clients = 192.168.1.0/24;
    Access_Type = RW;
    Squash = All_Squash;
    Anonymous_Uid = 1000;
    Anonymous_Gid = 1000;
  }
}

# The system dataset's data directory, for the `onyx-data` pool. Deliberately
# not its parent: exporting /mnt/onyx would hand a client the appliance root
# and, with the pool mounted underneath it, a mount crossing that no export
# covers (stale handles on every read of main-pool).
EXPORT {
  Export_Id = 79;
  Path = /mnt/onyx/onyx-data;
  Pseudo = /mnt/onyx/onyx-data;
  Protocols = 3,4;
  Access_Type = RW;
  SecType = sys;
  Squash = All_Squash;
  Anonymous_Uid = 1000;
  Anonymous_Gid = 1000;
  FSAL {
    Name = VFS;
  }
  CLIENT {
    Clients = 192.168.1.0/24;
    Access_Type = RW;
    Squash = All_Squash;
    Anonymous_Uid = 1000;
    Anonymous_Gid = 1000;
  }
}
